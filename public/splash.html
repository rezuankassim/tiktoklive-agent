<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>Starting Lockbah Print Agent</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #262829;
        font-family: Arial, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      h1 {
        margin: 4px 0 0;
        font-family: Georgia, serif;
        font-size: 27px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: #6a7072;
        font-size: 13px;
      }
      .progress {
        width: 120px;
        height: 3px;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 3px;
        background: #e8ebeb;
      }
      .progress::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #ddc24a;
        animation: move 1.2s ease-in-out infinite alternate;
      }
      @keyframes move {
        to {
          transform: translateX(180%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./logo.png" alt="" />
      <h1>Lockbah</h1>
      <p>Starting Print Agent</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
  </body>
</html>
