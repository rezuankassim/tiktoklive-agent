name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOCKBAH_API_BASE_URL: https://lockbah.com
  LOCKBAH_UPDATE_URL: https://update.electronjs.org/${{ github.repository }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read and verify package version
        id: package-version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          if ($packageVersion -ne $lockVersion) {
            throw "package.json version $packageVersion does not match package-lock.json version $lockVersion"
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run make -- --arch=x64

      - name: Verify updater manifest version
        shell: pwsh
        run: |
          $version = "${{ steps.package-version.outputs.version }}"
          $manifest = Get-ChildItem out/make -Filter RELEASES -Recurse | Select-Object -First 1
          if (-not $manifest) {
            throw "The Squirrel RELEASES manifest was not generated"
          }
          $expectedPackage = "LockbahPrintAgent-$version-full.nupkg"
          if ((Get-Content $manifest.FullName -Raw) -notmatch [regex]::Escape($expectedPackage)) {
            throw "The updater manifest does not contain $expectedPackage"
          }

      - name: Test Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.package-version.outputs.version }}"
          $setup = Get-ChildItem out/make -Filter LockbahPrintAgentSetup.exe -Recurse | Select-Object -First 1
          if (-not $setup) {
            throw "The Windows setup executable was not generated"
          }

          Add-Type -AssemblyName PresentationCore
          $gifPath = (Resolve-Path "assets/install-spinner.gif").Path
          $gifFrame = [System.Windows.Media.Imaging.BitmapFrame]::Create([Uri]$gifPath)
          if ($gifFrame.PixelWidth -ne 140 -or $gifFrame.PixelHeight -ne 140) {
            throw "The installer GIF must be 140 by 140 pixels"
          }

          $startedAt = Get-Date
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "--silent" -PassThru
          if (-not $installer.WaitForExit(120000)) {
            $installer.Kill()
            throw "The Windows installer did not exit within two minutes"
          }
          if ($installer.ExitCode -ne 0) {
            throw "The Windows installer exited with code $($installer.ExitCode)"
          }

          $installedVersion = Join-Path $env:LOCALAPPDATA "LockbahPrintAgent/app-$version"
          $deadline = (Get-Date).AddSeconds(30)
          while (-not (Test-Path $installedVersion) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $installedVersion)) {
            throw "The installer did not create $installedVersion"
          }

          Start-Sleep -Seconds 15
          Get-Process LockbahPrintAgent -ErrorAction SilentlyContinue | Stop-Process -Force
          $squirrelCrashes = Get-WinEvent -FilterHashtable @{
            LogName = "Application"
            StartTime = $startedAt
          } -ErrorAction SilentlyContinue | Where-Object {
            $_.Id -in 1000, 1026 -and $_.Message -match "Update\.exe|Squirrel\.Update"
          }
          if ($squirrelCrashes) {
            $squirrelCrashes | Format-List TimeCreated, Id, ProviderName, Message
            throw "Squirrel crashed while installing the generated setup"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbah-print-agent-windows
          path: out/make/**
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: ${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.exe
            out/make/**/RELEASES
            out/make/**/*.nupkg
