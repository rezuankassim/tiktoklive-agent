name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOCKBAH_API_BASE_URL: https://lockbah.com
  LOCKBAH_UPDATE_URL: https://update.electronjs.org/${{ github.repository }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read and verify package version
        id: package-version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          if ($packageVersion -ne $lockVersion) {
            throw "package.json version $packageVersion does not match package-lock.json version $lockVersion"
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run make -- --arch=x64

      - name: Verify updater manifest version
        shell: pwsh
        run: |
          $version = "${{ steps.package-version.outputs.version }}"
          $manifest = Get-ChildItem out/make -Filter RELEASES -Recurse | Select-Object -First 1
          if (-not $manifest) {
            throw "The Squirrel RELEASES manifest was not generated"
          }
          $expectedPackage = "LockbahPrintAgent-$version-full.nupkg"
          if ((Get-Content $manifest.FullName -Raw) -notmatch [regex]::Escape($expectedPackage)) {
            throw "The updater manifest does not contain $expectedPackage"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbah-print-agent-windows
          path: out/make/**
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: ${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.exe
            out/make/**/RELEASES
            out/make/**/*.nupkg
