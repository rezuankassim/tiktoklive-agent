name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOCKBAH_API_BASE_URL: https://lockbah.com

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --version=3.14.0 --yes --no-progress

      - name: Read and verify package version
        id: package-version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          if ($packageVersion -ne $lockVersion) {
            throw "package.json version $packageVersion does not match package-lock.json version $lockVersion"
          }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: npm run make -- --arch=x64

      - name: Test Windows installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem out/make -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw "The Windows MSI was not generated"
          }
          $log = Join-Path $env:RUNNER_TEMP "lockbah-msi-install.log"
          $installer = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/L*v', "`"$log`"") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            throw "The Windows MSI exited with code $($installer.ExitCode)"
          }
          $exe = Join-Path $env:ProgramFiles "Lockbah Print Agent/LockbahPrintAgent.exe"
          if (-not (Test-Path $exe)) {
            throw "The MSI did not install $exe"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockbah-print-agent-windows
          path: out/make/**
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: ${{ steps.package-version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            out/make/**/*.msi
